<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" width="1140" height="600" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
  <!--
    "You defended the fence. Wi-Fi ignores the fence."
    Concentric coverage rings leak past the wall; a rooftop drone sweeps
    the plant AP and captures what crosses the outer ring. Pure SMIL,
    no JS. Loops indefinitely. cx=567 cy=360 is the AP.
  -->
  <defs>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1140" height="600" fill="#0b0f17"/>

  <!-- title -->
  <text x="570" y="52" text-anchor="middle" fill="#E5E7EB" font-size="26" font-weight="700" letter-spacing="1">
    You defended the fence. <tspan fill="#F87171">Wi-Fi ignores the fence.</tspan>
  </text>

  <!-- ground line -->
  <line x1="0" y1="438" x2="1140" y2="438" stroke="#2a3344" stroke-width="2"/>

  <!-- fences -->
  <g stroke="#3a4152" stroke-width="2" stroke-dasharray="3 6">
    <line x1="205" y1="330" x2="205" y2="438"/>
    <line x1="905" y1="330" x2="905" y2="438"/>
  </g>
  <text x="205" y="322" text-anchor="middle" fill="#6B7280" font-size="12" letter-spacing="1">FENCE</text>
  <text x="905" y="322" text-anchor="middle" fill="#6B7280" font-size="12" letter-spacing="1">FENCE</text>

  <!-- ===== radar sweep from the AP (rotating wedge) ===== -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 567 360" to="360 567 360" dur="7s" repeatCount="indefinite"/>
    <polygon points="567,360 923,310 923,410" fill="url(#sweep)"/>
    <line x1="567" y1="360" x2="923" y2="310" stroke="#34D399" stroke-width="1.4" opacity="0.5"/>
  </g>

  <!-- ===== emanating signal pulses (ignore the fence) ===== -->
  <g fill="none" stroke-width="1.6">
    <circle cx="567" cy="360" r="40" stroke="#FBBF24">
      <animate attributeName="r" values="40;360" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="567" cy="360" r="40" stroke="#FBBF24">
      <animate attributeName="r" values="40;360" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== concentric coverage rings (marching dashes = live signal) ===== -->
  <g fill="none" stroke-width="1.6">
    <!-- intended coverage -->
    <circle cx="567" cy="360" r="150" stroke="#34D399" stroke-dasharray="7 9">
      <animate attributeName="stroke-dashoffset" values="0;160" dur="9s" repeatCount="indefinite"/>
    </circle>
    <!-- leaks past the fence -->
    <circle cx="567" cy="360" r="252" stroke="#FBBF24" stroke-dasharray="7 11">
      <animate attributeName="stroke-dashoffset" values="0;180" dur="12s" repeatCount="indefinite"/>
    </circle>
    <!-- reachable by a patient attacker -->
    <circle cx="567" cy="360" r="358" stroke="#F87171" stroke-dasharray="7 13">
      <animate attributeName="stroke-dashoffset" values="180;0" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== plant floor + AP box ===== -->
  <g>
    <rect x="452" y="326" width="230" height="96" rx="8" fill="#141b29" stroke="#2b3345" stroke-width="1.5"/>
    <g fill="#0f1826" stroke="#34D399" stroke-width="1.6">
      <rect x="486" y="350" width="34" height="34" rx="2"/>
      <rect x="550" y="350" width="34" height="34" rx="2"/>
      <rect x="614" y="350" width="34" height="34" rx="2"/>
    </g>
    <circle cx="567" cy="360" r="5" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="567" y="412" text-anchor="middle" fill="#9CA3AF" font-size="14" letter-spacing="1">PLANT FLOOR + AP</text>
  </g>

  <!-- ===== leak dots (parking lot / next unit) ===== -->
  <g>
    <circle cx="310" cy="393" r="8" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="310" y="420" text-anchor="middle" fill="#FBBF24" font-size="13">parking lot</text>
    <circle cx="872" cy="393" r="8" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="872" y="420" text-anchor="middle" fill="#FBBF24" font-size="13">next unit</text>
  </g>

  <!-- ===== rooftop drone + capture beam ===== -->
  <!-- beam from AP out to the drone: a captured packet rides it -->
  <line x1="567" y1="360" x2="975" y2="158" stroke="#F87171" stroke-width="1.3" stroke-dasharray="2 7" opacity="0.45"/>
  <circle r="4" fill="#F3F4F6">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M567 360 L975 158"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <g>
    <!-- gentle hover -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -6; 0 0" dur="3.4s" repeatCount="indefinite"/>
    <circle cx="975" cy="158" r="22" fill="url(#pulse)"/>
    <g transform="translate(975,158)" stroke="#F87171" stroke-width="2.4" fill="none" stroke-linecap="round">
      <line x1="-26" y1="-12" x2="26" y2="12"/>
      <line x1="-26" y1="12" x2="26" y2="-12"/>
      <circle cx="-26" cy="-12" r="7"/>
      <circle cx="26"  cy="-12" r="7"/>
      <circle cx="-26" cy="12"  r="7"/>
      <circle cx="26"  cy="12"  r="7"/>
      <rect x="-9" y="-5" width="18" height="10" rx="2" fill="#F87171"/>
    </g>
    <text x="975" y="200" text-anchor="middle" fill="#F87171" font-size="13" letter-spacing="1">drone on the roof</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="14" fill="#9CA3AF">
    <circle cx="792" cy="492" r="6" fill="#34D399"/><text x="808" y="497">intended coverage</text>
    <circle cx="792" cy="518" r="6" fill="#FBBF24"/><text x="808" y="523">leaks past the fence</text>
    <circle cx="792" cy="544" r="6" fill="#F87171"/><text x="808" y="549">reachable by a patient attacker</text>
  </g>

  <!-- footnote -->
  <text x="40" y="520" fill="#6B7280" font-size="14.5">A $15k drone or a long antenna</text>
  <text x="40" y="544" fill="#6B7280" font-size="14.5">reaches what guards never see.</text>
</svg>
