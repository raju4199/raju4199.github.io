<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="900" height="370" fill="#0c1013"/>
  <defs>
    <marker id="np-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3ee08a"/>
    </marker>
  </defs>

  <text x="450" y="38" font-size="16" fill="#e3ebe7" text-anchor="middle">NotPetya: from one software update to $10 billion</text>

  <g text-anchor="middle">
    <rect x="30" y="70" width="240" height="84" rx="12" fill="#121820" stroke="#fbbf24"/>
    <text x="150" y="98" font-size="11" fill="#fbbf24">1 · SUPPLY CHAIN</text>
    <text x="150" y="120" font-size="13" fill="#e3ebe7">M.E.Doc update</text>
    <text x="150" y="138" font-size="11" fill="#8b9892">server hijacked</text>

    <rect x="330" y="70" width="240" height="84" rx="12" fill="#121820" stroke="#fbbf24"/>
    <text x="450" y="98" font-size="11" fill="#fbbf24">2 · POISONED UPDATE</text>
    <text x="450" y="120" font-size="13" fill="#e3ebe7">Installed by firms</text>
    <text x="450" y="138" font-size="11" fill="#8b9892">doing business in Ukraine</text>

    <rect x="630" y="70" width="240" height="84" rx="12" fill="#121820" stroke="#3cc8e6"/>
    <text x="750" y="98" font-size="11" fill="#3cc8e6">3 · STOLEN CREDENTIALS</text>
    <text x="750" y="120" font-size="13" fill="#e3ebe7">Admin passwords</text>
    <text x="750" y="138" font-size="11" fill="#8b9892">pulled from memory</text>

    <rect x="630" y="200" width="240" height="84" rx="12" fill="#121820" stroke="#3cc8e6"/>
    <text x="750" y="228" font-size="11" fill="#3cc8e6">4 · SPREAD</text>
    <text x="750" y="250" font-size="13" fill="#e3ebe7">EternalBlue + creds</text>
    <text x="750" y="268" font-size="11" fill="#8b9892">whole domain in minutes</text>

    <rect x="330" y="200" width="240" height="84" rx="12" fill="#121820" stroke="#f87171"/>
    <text x="450" y="228" font-size="11" fill="#f87171">5 · WIPE</text>
    <text x="450" y="250" font-size="13" fill="#e3ebe7">Disks destroyed</text>
    <text x="450" y="268" font-size="11" fill="#8b9892">no key, no recovery</text>

    <rect x="30" y="200" width="240" height="84" rx="12" fill="#2a1316" stroke="#f87171" stroke-width="2"/>
    <text x="150" y="228" font-size="11" fill="#f87171">RESULT</text>
    <text x="150" y="254" font-size="22" font-weight="700" fill="#f87171">~$10 billion</text>
    <text x="150" y="272" font-size="11" fill="#8b9892">Maersk · Merck · FedEx</text>
  </g>

  <g stroke="#3ee08a" stroke-width="2" fill="none" marker-end="url(#np-arrow)">
    <path d="M270 112H324"/>
    <path d="M570 112H624"/>
    <path d="M750 154V194"/>
    <path d="M630 242H576"/>
    <path d="M330 242H276"/>
  </g>

  <text x="450" y="330" font-size="12" fill="#8b9892" text-anchor="middle">Patched machines fell too: stolen admin credentials walked right past MS17-010.</text>
</svg>
