<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="900" height="430" fill="#0c1013"/>
  <defs>
    <marker id="et-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3ee08a"/>
    </marker>
    <marker id="et-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f87171"/>
    </marker>
  </defs>

  <text x="450" y="36" font-size="16" fill="#e3ebe7" text-anchor="middle">Evil Twin: the operator's tablet connects to the attacker, not the plant</text>

  <g text-anchor="middle">
    <rect x="40" y="170" width="200" height="90" rx="12" fill="#121820" stroke="#3cc8e6"/>
    <text x="140" y="200" font-size="11" fill="#3cc8e6">OPERATOR TABLET</text>
    <text x="140" y="223" font-size="12" fill="#e3ebe7">Looks for SSID</text>
    <text x="140" y="243" font-size="12" fill="#fbbf24">"PLANT-OPS"</text>

    <rect x="350" y="60" width="200" height="90" rx="12" fill="#0e1a12" stroke="#3ee08a"/>
    <text x="450" y="90" font-size="11" fill="#3ee08a">REAL ACCESS POINT</text>
    <text x="450" y="113" font-size="12" fill="#e3ebe7">"PLANT-OPS"</text>
    <text x="450" y="133" font-size="11" fill="#8b9892">weaker signal, far away</text>

    <rect x="350" y="285" width="200" height="90" rx="12" fill="#2a1316" stroke="#f87171" stroke-width="2"/>
    <text x="450" y="315" font-size="11" fill="#f87171">EVIL TWIN AP</text>
    <text x="450" y="338" font-size="12" fill="#e3ebe7">Same "PLANT-OPS"</text>
    <text x="450" y="358" font-size="11" fill="#8b9892">stronger signal, in the lot</text>

    <rect x="660" y="285" width="200" height="90" rx="12" fill="#121820" stroke="#f87171"/>
    <text x="760" y="315" font-size="11" fill="#f87171">ATTACKER</text>
    <text x="760" y="338" font-size="12" fill="#e3ebe7">Captures logins,</text>
    <text x="760" y="358" font-size="12" fill="#e3ebe7">reads &amp; alters traffic</text>
  </g>

  <path d="M240 200 Q300 150 350 118" stroke="#3ee08a" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#et-g)"/>
  <text x="300" y="150" font-size="10" fill="#3ee08a" text-anchor="middle">faint</text>

  <path d="M240 228 Q300 270 350 318" stroke="#f87171" stroke-width="3" fill="none" marker-end="url(#et-r)"/>
  <text x="285" y="285" font-size="10" fill="#f87171" text-anchor="middle">strongest signal wins</text>

  <path d="M550 330 H654" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#et-r)"/>

  <text x="450" y="405" font-size="11" fill="#8b9892" text-anchor="middle">The tablet trusts the name, not the device. The loudest radio with the right name takes the session.</text>
</svg>
