<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="900" height="440" fill="#0c1013"/>
  <defs>
    <marker id="eb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3ee08a"/>
    </marker>
    <marker id="eb-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f87171"/>
    </marker>
  </defs>

  <text x="450" y="38" font-size="16" fill="#e3ebe7" text-anchor="middle">EternalBlue + WannaCry: how one PC infects a whole network</text>

  <!-- step boxes -->
  <g text-anchor="middle">
    <rect x="30" y="70" width="170" height="80" rx="12" fill="#121820" stroke="#f87171"/>
    <text x="115" y="100" font-size="11" fill="#f87171">STEP 1</text>
    <text x="115" y="120" font-size="14" fill="#e3ebe7">Infected host</text>
    <text x="115" y="138" font-size="11" fill="#8b9892">sends crafted SMBv1</text>

    <rect x="253" y="70" width="170" height="80" rx="12" fill="#121820" stroke="#fbbf24"/>
    <text x="338" y="100" font-size="11" fill="#fbbf24">STEP 2</text>
    <text x="338" y="120" font-size="14" fill="#e3ebe7">Unpatched Windows</text>
    <text x="338" y="138" font-size="11" fill="#8b9892">port 445 · MS17-010</text>

    <rect x="476" y="70" width="170" height="80" rx="12" fill="#121820" stroke="#3cc8e6"/>
    <text x="561" y="100" font-size="11" fill="#3cc8e6">STEP 3</text>
    <text x="561" y="120" font-size="14" fill="#e3ebe7">DoublePulsar</text>
    <text x="561" y="138" font-size="11" fill="#8b9892">kernel backdoor, SYSTEM</text>

    <rect x="699" y="70" width="170" height="80" rx="12" fill="#121820" stroke="#f87171"/>
    <text x="784" y="100" font-size="11" fill="#f87171">STEP 4</text>
    <text x="784" y="120" font-size="14" fill="#e3ebe7">WannaCry payload</text>
    <text x="784" y="138" font-size="11" fill="#8b9892">encrypts, asks $300 BTC</text>

    <rect x="330" y="205" width="240" height="60" rx="12" fill="#121820" stroke="#3ee08a"/>
    <text x="450" y="231" font-size="14" fill="#e3ebe7">Scan random IPs + LAN</text>
    <text x="450" y="251" font-size="11" fill="#8b9892">looking for open port 445</text>
  </g>

  <!-- arrows -->
  <g stroke="#3ee08a" stroke-width="2" fill="none" marker-end="url(#eb-arrow)">
    <path d="M200 110H247"/>
    <path d="M423 110H470"/>
    <path d="M646 110H693"/>
    <path d="M784 150V235H576"/>
    <path d="M450 265V295H235V323"/>
    <path d="M450 265V323"/>
    <path d="M450 265V295H665V323"/>
  </g>

  <!-- new victims -->
  <g text-anchor="middle">
    <rect x="150" y="328" width="170" height="54" rx="10" fill="#121820" stroke="#f87171" stroke-dasharray="5 4"/>
    <text x="235" y="352" font-size="13" fill="#e3ebe7">New victim</text>
    <text x="235" y="369" font-size="11" fill="#8b9892">hospital PC</text>

    <rect x="365" y="328" width="170" height="54" rx="10" fill="#121820" stroke="#f87171" stroke-dasharray="5 4"/>
    <text x="450" y="352" font-size="13" fill="#e3ebe7">New victim</text>
    <text x="450" y="369" font-size="11" fill="#8b9892">factory server</text>

    <rect x="580" y="328" width="170" height="54" rx="10" fill="#121820" stroke="#f87171" stroke-dasharray="5 4"/>
    <text x="665" y="352" font-size="13" fill="#e3ebe7">New victim</text>
    <text x="665" y="369" font-size="11" fill="#8b9892">MRI workstation</text>
  </g>

  <!-- loop back -->
  <path d="M150 355H70V156" stroke="#f87171" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#eb-arrow-red)"/>
  <text x="450" y="418" font-size="12" fill="#f87171" text-anchor="middle">every new victim becomes the next attacker → exponential spread</text>
</svg>
