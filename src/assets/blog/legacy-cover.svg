<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="1200" height="630" fill="#0c1013"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16202a" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- old CRT terminal -->
  <g transform="translate(720 120)">
    <rect x="0" y="0" width="400" height="300" rx="22" fill="#121820" stroke="#2a3540" stroke-width="3"/>
    <rect x="28" y="28" width="344" height="230" rx="10" fill="#081008" stroke="#3ee08a" stroke-opacity=".35"/>
    <g font-size="16" fill="#3ee08a">
      <text x="48" y="64">C:\&gt; ver</text>
      <text x="48" y="90" fill="#8b9892">Windows XP [5.1.2600]</text>
      <text x="48" y="122">C:\&gt; uptime</text>
      <text x="48" y="148" fill="#8b9892">4,812 days</text>
      <text x="48" y="180">C:\&gt; last_patch</text>
      <text x="48" y="206" fill="#f87171">2014-04-08  [EOL]</text>
      <text x="48" y="238">C:\&gt; _</text>
    </g>
    <rect x="150" y="300" width="100" height="40" fill="#121820" stroke="#2a3540" stroke-width="3"/>
    <rect x="100" y="338" width="200" height="16" rx="6" fill="#121820" stroke="#2a3540" stroke-width="3"/>
  </g>

  <g fill="#e3ebe7">
    <text x="80" y="150" font-size="22" fill="#f87171" letter-spacing="6">// SECURITY · RESEARCH</text>
    <text x="80" y="250" font-size="78" font-weight="700">The Zombie</text>
    <text x="80" y="340" font-size="78" font-weight="700">Machines</text>
    <rect x="80" y="370" width="420" height="6" fill="url(#fade)"/>
    <text x="80" y="430" font-size="24" fill="#8b9892">Why legacy systems are the</text>
    <text x="80" y="464" font-size="24" fill="#8b9892">most dangerous thing in your network</text>
    <text x="80" y="498" font-size="24" fill="#8b9892">and why industry still won't let go.</text>
  </g>

  <g font-size="16" fill="#8b9892">
    <text x="80" y="570">MS17-010 · CVE-2019-0708 · CVE-2008-4250 · CVE-2014-0160 · CVE-2021-44228</text>
  </g>
</svg>
