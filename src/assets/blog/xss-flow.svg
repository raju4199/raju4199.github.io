<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="880" height="300" fill="#0c1013"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3ee08a"/>
    </marker>
  </defs>

  <g font-size="15" fill="#e3ebe7" text-anchor="middle">
    <rect x="40" y="110" width="170" height="80" rx="12" fill="#121820" stroke="#f87171"/>
    <text x="125" y="146">Attacker</text>
    <text x="125" y="168" font-size="12" fill="#8b9892">crafts the link</text>

    <rect x="355" y="110" width="170" height="80" rx="12" fill="#121820" stroke="#3cc8e6"/>
    <text x="440" y="146">Victim browser</text>
    <text x="440" y="168" font-size="12" fill="#8b9892">clicks, runs script</text>

    <rect x="670" y="110" width="170" height="80" rx="12" fill="#121820" stroke="#3ee08a"/>
    <text x="755" y="146">Vulnerable app</text>
    <text x="755" y="168" font-size="12" fill="#8b9892">reflects input</text>
  </g>

  <g stroke="#3ee08a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M210 150H350"/>
    <path d="M525 135H665"/>
    <path d="M665 170H530"/>
    <path d="M440 190V240H130V195" stroke-dasharray="6 6" stroke="#f87171"/>
  </g>

  <g font-size="12" fill="#8b9892" text-anchor="middle">
    <text x="280" y="140">1 · malicious URL</text>
    <text x="595" y="125">2 · GET ?q=&lt;payload&gt;</text>
    <text x="597" y="192">3 · payload in HTML</text>
    <text x="285" y="262" fill="#f87171">4 · session data exfiltrated</text>
  </g>
</svg>
