  <text x="340" y="94" text-anchor="middle" fill="#4a6fa5" font-family="monospace" font-size="10" font-weight="600" letter-spacing="2" opacity="0.7">APP LAYER</text>
  <text x="600" y="94" text-anchor="middle" fill="#4a6fa5" font-family="monospace" font-size="10" font-weight="600" letter-spacing="2" opacity="0.7">AGENT CORE</text>
  <text x="870" y="94" text-anchor="middle" fill="#4a6fa5" font-family="monospace" font-size="10" font-weight="600" letter-spacing="2" opacity="0.7">TOOLS (MCP)</text>
  <text x="1090" y="94" text-anchor="middle" fill="#4a6fa5" font-family="monospace" font-size="10" font-weight="600" letter-spacing="2" opacity="0.7">DATA</text>

  <!-- Zone dividers -->
